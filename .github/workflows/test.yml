name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test
      - run: for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - run: npx -y skills-ref validate skills/business-idea-validator
      - run: node scripts/release-plan.mjs --check
